[package]
name = "jgdmr"
description = "CLI binary for jgd: http, tui, and headless subcommands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jgd-protocol = { workspace = true }
jgd-font-metrics = { workspace = true }
jgd-render = { workspace = true }
jgd-server = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
crossterm = { workspace = true }
image = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true }
tower = { version = "0.5", features = ["util"] }
