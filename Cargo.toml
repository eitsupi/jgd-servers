[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/eitsupi/jgd-servers"

[workspace.dependencies]
# Internal crates
jgd-protocol = { path = "crates/jgd-protocol" }
jgd-font-metrics = { path = "crates/jgd-font-metrics" }
jgd-render = { path = "crates/jgd-render" }
jgd-server = { path = "crates/jgd-server" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Font metrics (parley)
parley = "0.8"
fontique = { version = "0.8", features = ["fontconfig-dlopen"] }

# Rendering
tiny-skia = "0.12"

# CLI
clap = { version = "4.6", features = ["derive"] }

# HTTP / WebSocket
axum = "0.8"
tokio-tungstenite = "0.29"

# Terminal UI
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = "10.0"

# Futures
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

# Testing
insta = { version = "1.47", features = ["json"] }
tempfile = "3"
